<nav class="bg-gradient-to-r from-indigo-950 via-purple-950 to-slate-950 text-white shadow-lg border-b border-indigo-800/30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Left side: Brand + Divider + Links -->
      <div class="flex items-center space-x-6">
        <!-- Logo / Brand -->
        <a href="#" class="flex items-center gap-2.5 text-white hover:text-indigo-200 transition-colors">
          <!-- Users Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
          <span class="font-extrabold tracking-wider text-base uppercase">Dating App</span>
        </a>

        <!-- Vertical Divider -->
        <div class="h-6 w-px bg-white/20"></div>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center space-x-5 text-xs font-semibold tracking-wider text-indigo-200/90 uppercase">
          <a href="#" class="hover:text-white transition-colors py-1">Matches</a>
          <a href="#" class="hover:text-white transition-colors py-1">Lists</a>
          <a href="#" class="hover:text-white transition-colors py-1">Messages</a>
        </div>
      </div>

      <!-- Right side: Conditional Form or User Dropdown -->
      <div class="flex items-center space-x-2">

        @if (accountService.currentUser(); as user) {
          <!-- User Profile Dropdown -->
          <div class="dropdown dropdown-end">
            <!-- Dropdown Toggle Button -->
            <div tabindex="0" role="button" class="btn btn-ghost btn-sm flex items-center gap-2 hover:bg-white/10 rounded-full py-1 px-3 text-white">
              <!-- Avatar -->
              <div class="avatar">
                <div class="w-7 h-7 rounded-full ring-1 ring-white/30 bg-indigo-600 flex items-center justify-center text-white text-xs font-bold uppercase">
                  @if (user.imageUrl) {
                    <img [src]="user.imageUrl" alt="User Avatar" />
                  } @else {
                    <span>{{ user.displayName.charAt(0) }}</span>
                  }
                </div>
              </div>

              <!-- User Name -->
              <span class="text-xs font-semibold capitalize">{{ user.displayName }}</span>

              <!-- Chevron Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 opacity-70" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </div>

            <!-- Dropdown Menu Items -->
            <ul tabindex="0" class="dropdown-content menu z-50 p-2 shadow-2xl bg-slate-900 border border-white/10 rounded-2xl w-52 mt-2 space-y-1 text-slate-200 text-xs">
              <li>
                <a class="flex items-center gap-2.5 py-2 hover:bg-white/10 rounded-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                  </svg>
                  Edit Profile
                </a>
              </li>
              <div class="divider my-1 border-white/10"></div>
              <li>
                <a (click)="logout()" class="flex items-center gap-2.5 py-2 text-rose-400 hover:bg-rose-500/20 hover:text-rose-300 rounded-xl cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  Logout
                </a>
              </li>
            </ul>
          </div>
        } @else {
          <!-- Login Form -->
          <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center space-x-2">
            <input 
              [(ngModel)]="creds.email"
              name="email"
              type="email" 
              placeholder="Email" 
              class="input input-sm bg-white text-slate-800 placeholder-slate-400 rounded-md border-0 w-36 sm:w-48 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-xs" 
            />

            <input 
              [(ngModel)]="creds.password"
              name="password"
              type="password" 
              placeholder="Password" 
              class="input input-sm bg-white text-slate-800 placeholder-slate-400 rounded-md border-0 w-36 sm:w-48 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-xs" 
            />

            <button 
              type="submit" 
              class="btn btn-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium border-0 rounded-md px-4 text-xs transition-colors shadow-sm">
              Login
            </button>
          </form>
        }

      </div>

    </div>
  </div>
</nav>
