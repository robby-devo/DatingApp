<div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 space-y-8">
  <!-- Header -->
  <div class="text-center space-y-2">
    <h2 class="text-3xl font-extrabold text-white tracking-tight">Test Errors</h2>
    <p class="text-sm text-slate-400">Trigger test errors from BuggyController to test error interceptors</p>
  </div>

  <!-- Buttons Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    <!-- 404 Button -->
    <button 
      (click)="get404Error()" 
      class="btn btn-outline btn-warning rounded-2xl flex flex-col items-center justify-center p-6 h-auto gap-2 hover:scale-[1.02] transition-transform">
      <span class="text-xl font-bold">404</span>
      <span class="text-xs uppercase tracking-wider font-semibold">Not Found</span>
    </button>

    <!-- 400 Button -->
    <button 
      (click)="get400Error()" 
      class="btn btn-outline btn-info rounded-2xl flex flex-col items-center justify-center p-6 h-auto gap-2 hover:scale-[1.02] transition-transform">
      <span class="text-xl font-bold">400</span>
      <span class="text-xs uppercase tracking-wider font-semibold">Bad Request</span>
    </button>

    <!-- 500 Button -->
    <button 
      (click)="get500Error()" 
      class="btn btn-outline btn-error rounded-2xl flex flex-col items-center justify-center p-6 h-auto gap-2 hover:scale-[1.02] transition-transform">
      <span class="text-xl font-bold">500</span>
      <span class="text-xs uppercase tracking-wider font-semibold">Server Error</span>
    </button>

    <!-- 401 Button -->
    <button 
      (click)="get401Error()" 
      class="btn btn-outline btn-secondary rounded-2xl flex flex-col items-center justify-center p-6 h-auto gap-2 hover:scale-[1.02] transition-transform">
      <span class="text-xl font-bold">401</span>
      <span class="text-xs uppercase tracking-wider font-semibold">Unauthorized</span>
    </button>

    <!-- 400 Validation Error Button -->
    <button 
      (click)="get400ValidationError()" 
      class="btn btn-outline btn-accent rounded-2xl flex flex-col items-center justify-center p-6 h-auto gap-2 sm:col-span-2 md:col-span-2 hover:scale-[1.02] transition-transform">
      <span class="text-xl font-bold">400</span>
      <span class="text-xs uppercase tracking-wider font-semibold">Validation Error (Register with empty body)</span>
    </button>
  </div>

  <!-- Validation Errors Display Box -->
  @if (validationErrors().length > 0) {
    <div class="p-6 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-200 space-y-3 shadow-xl backdrop-blur-md">
      <h3 class="font-bold text-base flex items-center gap-2 text-rose-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        Validation Errors ({{ validationErrors().length }}):
      </h3>
      <ul class="list-disc list-inside space-y-1 text-sm pl-2">
        @for (error of validationErrors(); track error) {
          <li>{{ error }}</li>
        }
      </ul>
    </div>
  }
</div>
