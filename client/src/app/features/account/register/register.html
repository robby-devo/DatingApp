<div class="w-full max-w-md mx-auto">
  <div
    class="p-8 rounded-3xl bg-white/10 border border-white/15 backdrop-blur-xl shadow-2xl text-white space-y-6"
  >
    <!-- Header -->
    <div class="text-center space-y-2">
      <div
        class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-500 to-indigo-600 mx-auto flex items-center justify-center shadow-lg shadow-rose-500/20"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
          />
        </svg>
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Create Account</h2>
      <p class="text-xs sm:text-sm text-slate-300">
        Sign up to start discovering your matches today
      </p>
    </div>

    <!-- Form (Pure Visual Structure - No Angular Logic) -->
    <form #registerForm="ngForm" class="space-y-4 text-left" (ngSubmit)="register()">
      <!-- Display Name Field -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200">
          Display Name
        </label>
        <div class="relative">
          <input
            type="text"
            name="displayName"
            [(ngModel)]="creds.displayName"
            placeholder="How should others see you?"
            class="input w-full bg-white/10 border border-white/20 text-white placeholder-slate-400 rounded-xl focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 text-sm"
          />
        </div>
      </div>

      <!-- Email Field -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200">
          Email Address
        </label>
        <div class="relative">
          <input
            type="email"
            name="email"
            [(ngModel)]="creds.email"
            placeholder="you@example.com"
            class="input w-full bg-white/10 border border-white/20 text-white placeholder-slate-400 rounded-xl focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 text-sm"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200">
          Password
        </label>
        <div class="relative">
          <input
            type="password"
            name="password"
            [(ngModel)]="creds.password"
            placeholder="At least 4 characters"
            class="input w-full bg-white/10 border border-white/20 text-white placeholder-slate-400 rounded-xl focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30 text-sm"
          />
        </div>
      </div>

      <!-- Action Buttons: Register & Cancel -->
      <div class="flex items-center gap-3 pt-4">
        <button
          type="button"
          (click)="cancel()"
          class="btn flex-1 bg-white/10 hover:bg-white/20 text-white font-semibold border border-white/20 rounded-xl transition-all duration-200"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn flex-1 bg-gradient-to-r from-rose-500 to-indigo-600 hover:from-rose-600 hover:to-indigo-500 text-white font-semibold border-0 rounded-xl shadow-lg shadow-indigo-500/25 transition-all duration-200"
        >
          Register
        </button>
      </div>
    </form>
  </div>
</div>
