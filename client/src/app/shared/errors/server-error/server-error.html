<div class="max-w-4xl mx-auto py-12 px-4 sm:px-6 space-y-6">
  <!-- Header Card -->
  <div class="p-8 rounded-3xl bg-base-100/10 border border-white/10 backdrop-blur-xl shadow-2xl text-white space-y-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-rose-400">Internal Server Error - 500</h1>
        <p class="text-sm text-slate-300">An unexpected exception occurred on the backend server</p>
      </div>
    </div>

    @if (error) {
      <div class="space-y-4 pt-4 border-t border-white/10">
        <div>
          <h4 class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Error Message:</h4>
          <p class="text-rose-300 font-mono text-base font-semibold mt-1">{{ error.message }}</p>
        </div>

        <div>
          <h4 class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Stack Trace:</h4>
          <p class="text-xs text-slate-400 mt-1">Below is the stack trace from the .NET ExceptionMiddleware:</p>
          <div class="mt-2 p-4 rounded-2xl bg-black/50 border border-white/10 text-slate-300 font-mono text-xs overflow-x-auto whitespace-pre leading-relaxed">
            <code>{{ error.details }}</code>
          </div>
        </div>
      </div>
    } @else {
      <p class="text-sm text-slate-400">No error details available.</p>
    }
  </div>
</div>
